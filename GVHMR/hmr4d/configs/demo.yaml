defaults:
  - _self_
  - model: gvhmr/gvhmr_pl_demo
  - network: gvhmr/relative_transformer
  - endecoder: gvhmr/v1_amass_local_bedlam_cam

pipeline:
  _target_: GVHMR.hmr4d.model.gvhmr.pipeline.gvhmr_pipeline.Pipeline
  args_denoiser3d: ${network}
  args:
    endecoder_opt: ${endecoder}
    normalize_cam_angvel: True
    weights: null
    static_conf: null

ckpt_path: inputs/checkpoints/gvhmr/gvhmr_siga24_release.ckpt

# ================================ #
#          global setting          #
# ================================ #

video_name: ???
output_root: outputs/demo
output_dir: "${output_root}/${video_name}"
preprocess_dir: ${output_dir}/preprocess
video_path: "${output_dir}/0_input_video.mp4"

# Options
static_cam: False
verbose: False
use_dpvo: False
vitpose_lr_max_frames: 3  # Repair only strongly supported, brief leg-label swaps.
vitpose_conf_thr_lower_body: 0.4  # Heatmap score; 0 disables interpolation.
vitpose_conf_thr_upper_body: 0.4
# COCO17 order. 0 preserves the raw joint; replace an inherited value to tune it.
vitpose_joint_conf_thr:
  - 0  # nose
  - 0  # left eye
  - 0  # right eye
  - 0  # left ear
  - 0  # right ear
  - ${vitpose_conf_thr_upper_body}  # left shoulder
  - ${vitpose_conf_thr_upper_body}  # right shoulder
  - ${vitpose_conf_thr_upper_body}  # left elbow
  - ${vitpose_conf_thr_upper_body}  # right elbow
  - ${vitpose_conf_thr_upper_body}  # left wrist
  - ${vitpose_conf_thr_upper_body}  # right wrist
  - ${vitpose_conf_thr_lower_body}  # left hip
  - ${vitpose_conf_thr_lower_body}  # right hip
  - ${vitpose_conf_thr_lower_body}  # left knee
  - ${vitpose_conf_thr_lower_body}  # right knee
  - ${vitpose_conf_thr_lower_body}  # left ankle
  - ${vitpose_conf_thr_lower_body}  # right ankle
f_mm: null  # focal length of fullframe camera in mm

paths:
  bbx: ${preprocess_dir}/bbx.pt
  bbx_xyxy_video_overlay: ${preprocess_dir}/bbx_xyxy_video_overlay.mp4
  vit_features: ${preprocess_dir}/vit_features.pt
  vitpose: ${preprocess_dir}/vitpose.pt
  vitpose_raw: ${preprocess_dir}/vitpose_raw.pt
  vitpose_video_overlay: ${preprocess_dir}/vitpose_video_overlay.mp4
  vitpose_lr_swaps: ${preprocess_dir}/vitpose_lr_swaps.json
  hmr4d_results: ${output_dir}/hmr4d_results.pt
  hmr4d_spikes_plot: ${output_dir}/hmr4d_spikes.png
  hmr4d_spikes_csv: ${output_dir}/hmr4d_spikes.csv
  incam_video: ${output_dir}/1_incam.mp4
  global_video: ${output_dir}/2_global.mp4
  incam_global_horiz_video: ${output_dir}/${video_name}_3_incam_global_horiz.mp4
  slam: ${preprocess_dir}/slam_results.pt
