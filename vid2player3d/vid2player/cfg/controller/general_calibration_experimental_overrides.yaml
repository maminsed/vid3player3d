# Reference overrides only; NOT loaded by the stage configs.
# Copy/merge these env.physics and env.vid2player blocks to opt back in.
# This expensive, physically unaccepted preset changes the low-level plant;
# revalidate/retrain the low-level policy before using it.
env:
  physics:
    dt: 0.0005208333333333333
    controlFrequencyInv: 64
    substeps: 4
    solver_type: 0
    num_position_iterations: 4
    num_velocity_iterations: 8
    contact_offset: 1.0e-06
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    friction_offset_threshold: 0.02
    friction_correlation_distance: 0.025
    plane_restitution: 0.5
  vid2player:
    ball_physics:
      model: aerodynamic_v2
      angular_damping: 0.0
      max_angular_velocity: 10000.0
    tennis_contacts:
      model: hardcourt_v2
      ball_restitution: 0.9
      court_restitution: 0.64
      racket_restitution: 0.8
      ball_friction: 0.4
      court_friction: 1.0
      racket_friction: 0.6
      ball_contact_offset: 1.0e-06
      racket_contact_offset: 1.0e-06
    racket_dynamics:
      model: published_reference_v1
      max_angular_velocity: 1000.0
      mass: 0.27
      com_x: 0.18
      long_axis_inertia: 0.0012
      transverse_inertia: 0.0123
      normal_inertia: 0.01349
