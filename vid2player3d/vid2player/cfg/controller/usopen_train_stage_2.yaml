name: PhysicsMVAEController
test_name: MVAEControllerVis
env: 
  numEnvs: 2048
  episodeLength: 300
  envSpacing: 5
  isFlagrun: False
  enableDebugVis: False
  powerScale: 1.0
  numAMPObsSteps: 10
  enableHistObs: False
  enableEarlyTermination: False

  physics:
    config: usopen_im
    pretrained_model_cp: output/tennis_im_training_2/models/tennis_motion_2_latest.pth
    name: HumanoidSMPLIMMVAE
    test_name: HumanoidSMPLIMMVAE
    assetFileName: smpl_mesh_humanoid_djokovic.xml
    residual_force_scale: 31.85
    # Training baseline: 60 Hz physics calls, 30 Hz policy; original humanoid solver.
    # Optional expensive preset: general_calibration_experimental_overrides.yaml.
    dt: 0.016666666666666666
    controlFrequencyInv: 2
    substeps: 12  # Retain tested head-hit coverage; 2 restores original low-level substeps.
    solver_type: 1  # TGS, as used by the pretrained low-level policy.
    num_position_iterations: 4
    num_velocity_iterations: 0
    contact_offset: 0.02  # Restore the normal humanoid/ground contact neighborhood.
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 10.0
    friction_offset_threshold: 0.02
    friction_correlation_distance: 0.025
    # Shared ground plane also affects the feet; keep the pre-calibration value.
    plane_restitution: 0.5

  vid2player:
    mvae_ver: usopen
    mvae_inference_batch_size: 512  # Bound per-environment mixed decoder weights.
    predict_phase: False
    righthand: True
    player: djokovic
    grip: semi_western  # Matches the Djokovic asset's physical racket head.
    # Allowed root XY (meters); crossing a bound ends the episode.
    court_min: [-5, -16]
    court_max: [5, -10]
    # Legacy material values; the enabled contact profile overrides these.
    racket_friction: 0.8
    ball_friction: 0.2
    restitution: 0.9
    spin_scale: 5  # Used only when ball_physics.model is legacy.
    ball_physics:
      # Set model: legacy to restore the old forces, radius, and asset defaults.
      # Regenerate incoming previews AND outgoing reward data before training.
      model: aerodynamic_v2
      angular_damping: 0.0  # Explicit provisional baseline; decay needs calibration.
      max_angular_velocity: 1000.0  # rad/s; ball only, supports the intended spin range.

    tennis_contacts:
      # Set legacy to restore old materials and proximity-based bounce events.
      # Practical rigid baseline; keeps shared rebound/contact event fixes.
      # Court material is shared with the feet: preserve restitution 0.5 / friction 1.
      # hardcourt_v2 plus tiny explicit offsets is available in the experimental preset.
      model: hardcourt_v1
      ball_restitution: 1.0
      court_restitution: 0.5  # Ball/court pair average 0.75; original foot material.
      racket_restitution: 0.7  # Ball/string-bed pair average remains 0.85.
      ball_friction: 0.4
      court_friction: 1.0     # Ball/court pair average 0.7; foot friction retained.
      racket_friction: 0.6   # Ball/string-bed pair average 0.5.
      ball_contact_offset: 0.02
      racket_contact_offset: 0.05  # Earlier tested head-hit coverage at 12 substeps.

    # Preserve the mass/COM/inertia and body angular cap used by the frozen player.
    # Set published_reference_v1 to opt into the reference inertia values below.
    racket_dynamics:
      model: legacy
      max_angular_velocity: 1000.0  # Ignored in legacy mode; original body cap is 100 rad/s.
      mass: 0.270
      com_x: 0.180
      long_axis_inertia: 0.0012
      transverse_inertia: 0.0123
      normal_inertia: 0.01349

    reward_weights: {'pos': 0.1, 'ball_pos': 0.9}
    reward_scales: {'pos': 50, 'phase': 0}
    reward_type: return_w_estimate
    ball_traj_out_x_file: data/ball_traj/ball_traj_out_x.npy
    ball_traj_out_y_file: data/ball_traj/ball_traj_out_y.npy

    obs_ball_traj_length: 10
    use_history_ball_obs: False
    ball_traj_file: data/ball_traj/ball_traj_in.npy
    use_random_ball_target: True

    vae_action_scale: 1.5
    add_residual_dof: euler
    residual_dof_scale: 0.4
    aux_loss_specs: {'dof_res': 0.01}
    fix_head_orientation: True

    vae_init_conditions: data/vae/vae_init_condition_usopen_2.pt
    reset_reaction_nframes: 70
    random_walk_in_recovery: True
    
sim:
  none: 0

params:
  seed: 10

  algo:
    name: vid2player

  model:
    name: vid2player

  network:
    name: vid2player
    separate: True
    actor_net_type: 'style_cat1'
    latent_type: 'sphere'

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -0.69
        fixed_sigma: True

    mlp:
      units: [1024, 1024, 512]
      activation: relu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

    disc:
      units: [1024, 1024, 512]
      activation: relu

      initializer:
        name: default

    enc:
      units: [1024, 512]
      activation: relu
      separate: False

      initializer:
        name: default

  load_checkpoint: False

  config:
    name: usopen_no_phase
    protect_existing_checkpoints: True
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: True
    normalize_value: True
    reward_shaper:
      scale_value: 1
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 2e-5
    lr_schedule: constant
    score_to_win: 20000
    max_epochs: 10000
    save_best_after: 50
    save_frequency: 500
    print_stats: True
    entropy_coef: 0.0
    truncate_grads: True
    grad_norm: 50.0
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 4096
    mini_epochs: 3
    critic_coef: 5
    clip_value: False
    seq_len: 4
    bounds_loss_coef: 10
    clip_actions_val: 5.0
    pretrained_model_cp: results/usopen_train_stage_1/models/usopen_no_phase_latest.pth
    discard_pretrained_sigma: True
